name: Refresh

on:
  push:
    branches: 1.21.1-S3-DEV

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.1"
          check-latest: true
          cache: true

      - name: Install Packwiz
        run: |
          git clone https://github.com/packwiz/packwiz.git /tmp/packwiz
          cd /tmp/packwiz
          go build -o packwiz .
          sudo mv packwiz /usr/local/bin/

      - name: Run packwiz refresh
        run: packwiz refresh

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842
        with: 
            commit_message: Auto Refresh